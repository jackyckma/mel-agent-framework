# Merge Claude agent working branches (claude/*) into main after checks.
#
# Why this exists: repo-bound Claude Scheduled Tasks start on a fresh
# claude/<random> branch and can push ONLY to that branch — not main.
# This workflow is the sanctioned path onto main. Agents must never open PRs
# or force-push.
#
# On conflict, validation failure, or protected-path changes: we do NOT merge;
# the claude/* branch stays for the Lead/human to inspect (red Action run).
#
# If the owner later lets Claude push straight to main, this workflow is
# harmless: it only listens to pushes under claude/**.

name: Merge agent branches

on:
  push:
    branches:
      - "claude/**"

permissions:
  contents: write
  actions: write

concurrency:
  group: merge-agent-branches
  cancel-in-progress: false

jobs:
  merge:
    name: Validate and merge into main
    runs-on: ubuntu-latest
    steps:
      - name: Check out main with full history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Remember which agent branch was pushed
        id: meta
        run: |
          echo "branch=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "Agent branch: ${GITHUB_REF_NAME}"

      - name: Fetch the agent branch
        run: git fetch origin "${{ steps.meta.outputs.branch }}"

      - name: Freeze MAIN's checker scripts (agents must not gate themselves)
        run: |
          mkdir -p /tmp/mel-gate
          cp scripts/validate_repo.py scripts/check_protected_paths.py /tmp/mel-gate/
          # yaml_util is imported only if needed; validate_repo is standalone

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Protected-path guard (fail = no merge)
        run: |
          python /tmp/mel-gate/check_protected_paths.py \
            --base origin/main \
            --head "origin/${{ steps.meta.outputs.branch }}"

      - name: Merge agent branch into local main
        run: |
          git config user.name "mel-merge-bot"
          git config user.email "mel-merge-bot@users.noreply.github.com"
          BRANCH="${{ steps.meta.outputs.branch }}"
          if git merge-base --is-ancestor "origin/${BRANCH}" HEAD; then
            echo "Branch already contained in main; nothing to merge."
            echo "already=1" >> "$GITHUB_ENV"
          else
            # Fast-forward when possible; otherwise a merge commit.
            if git merge --ff-only "origin/${BRANCH}"; then
              echo "Fast-forward merge OK."
            else
              git merge --no-ff "origin/${BRANCH}" -m "merge: ${BRANCH} into main"
            fi
            echo "already=0" >> "$GITHUB_ENV"
          fi

      - name: Validate merged tree with MAIN's validator
        run: python /tmp/mel-gate/validate_repo.py

      - name: Push main
        if: env.already != '1'
        run: git push origin HEAD:main

      - name: Delete the merged agent branch
        if: env.already != '1'
        run: git push origin --delete "${{ steps.meta.outputs.branch }}"

      - name: Dispatch Pages deploy (GITHUB_TOKEN push does not trigger push workflows)
        if: env.already != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run pages.yml --ref main || \
            gh workflow run "Deploy dashboard to GitHub Pages" --ref main || \
            echo "Pages dispatch skipped (workflow may be absent or renamed)."
